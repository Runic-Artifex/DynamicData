name: Prepare upstream review

on:
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: 'Optional full commit SHA already reachable from upstream/main.'
        required: false
        type: string

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: upstream-review-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize durable evidence directory
        id: initialize
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/upstream-review"
          mkdir -p "$directory"
          printf '# Upstream review workflow evidence\n\nRun: %s\nRef: %s\n' "$GITHUB_RUN_ID" "$GITHUB_REF" > "$directory/run-context.md"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo 'Upstream review preparation must run from refs/heads/main.' >&2
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch and pin upstream candidate
        id: pin
        shell: bash
        env:
          REQUESTED_UPSTREAM_SHA: ${{ inputs.upstream_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/reactivemarbles/DynamicData.git \
            +refs/heads/main:refs/remotes/upstream/main
          candidate="${REQUESTED_UPSTREAM_SHA:-$(git rev-parse refs/remotes/upstream/main)}"
          [[ "$candidate" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'upstream_sha must be a full SHA.' >&2; exit 1; }
          git cat-file -e "$candidate^{commit}"
          git merge-base --is-ancestor "$candidate" refs/remotes/upstream/main || {
            echo 'upstream_sha must be reachable from the fetched upstream/main.' >&2
            exit 1
          }
          {
            echo "base=$(git rev-parse HEAD)"
            echo "upstream=$(git rev-parse "$candidate")"
            echo "month=$(date -u +%Y-%m)"
          } >> "$GITHUB_OUTPUT"

      - name: Collect fresh unassessed inventory
        id: inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          output="${{ steps.initialize.outputs.directory }}/inventory.json"
          node eng/upstream/collect-inventory.mjs --output "$output" --upstream "${{ steps.pin.outputs.upstream }}"
          echo "file=$output" >> "$GITHUB_OUTPUT"

      - name: Prepare immutable review snapshot
        id: prepare
        run: |
          set -euo pipefail
          output="${{ steps.initialize.outputs.directory }}/snapshot"
          node eng/upstream/prepare-review.mjs \
            --repo "$GITHUB_WORKSPACE" \
            --base "${{ steps.pin.outputs.base }}" \
            --upstream "${{ steps.pin.outputs.upstream }}" \
            --month "${{ steps.pin.outputs.month }}" \
            --inventory "${{ steps.inventory.outputs.file }}" \
            --output "$output"
          echo "directory=$output" >> "$GITHUB_OUTPUT"

      - name: Create one immutable fork review branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.pin.outputs.base }}"
          upstream="${{ steps.pin.outputs.upstream }}"
          # Keep the readable month and two 12-character immutable pins.
          branch="review/upstream/${{ steps.pin.outputs.month }}-${base:0:12}-${upstream:0:12}"
          result="$(bash eng/upstream/publish-review-branch.sh \
            --repo "$GITHUB_WORKSPACE" \
            --base "${{ steps.pin.outputs.base }}" \
            --upstream "${{ steps.pin.outputs.upstream }}" \
            --branch "$branch" \
            --snapshot "${{ steps.prepare.outputs.directory }}")"
          printf '%s\n' "$result"
          printf '%s\n' "$result" >> "$GITHUB_OUTPUT"

      - name: Open or recover fork review pull request
        id: pull-request
        if: ${{ steps.branch.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$(bash eng/upstream/open-review-pr.sh \
            --repo Runic-Artifex/DynamicData \
            --branch "${{ steps.branch.outputs.branch }}" \
            --base "${{ steps.pin.outputs.base }}" \
            --upstream "${{ steps.pin.outputs.upstream }}" \
            --month "${{ steps.pin.outputs.month }}" \
            --evidence-dir "${{ steps.initialize.outputs.directory }}")"
          printf '%s\n' "$result"
          printf '%s\n' "$result" >> "$GITHUB_OUTPUT"

      - name: Upload review evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-review-${{ github.run_id }}
          path: ${{ steps.initialize.outputs.directory }}
          if-no-files-found: error
