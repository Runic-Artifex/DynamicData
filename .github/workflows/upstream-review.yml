name: Upstream review

# Monthly upstream summary: uploads the raw inventory and a markdown summary as
# a workflow artifact and opens or updates one tracking issue per month. It
# pushes no branches, commits nothing and never merges upstream.

on:
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: 'Optional full commit SHA reachable from upstream main (defaults to upstream main).'
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-review-${{ github.repository }}
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: reactivemarbles/DynamicData

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        shell: bash
        run: |
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'Run the upstream review from main.' >&2; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and pin upstream
        id: pin
        shell: bash
        env:
          REQUESTED_UPSTREAM_SHA: ${{ inputs.upstream_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags "https://github.com/${UPSTREAM_REPOSITORY}.git" +refs/heads/main:refs/remotes/upstream/main
          candidate="${REQUESTED_UPSTREAM_SHA:-$(git rev-parse refs/remotes/upstream/main)}"
          [[ "$candidate" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'upstream_sha must be a full SHA.' >&2; exit 1; }
          git merge-base --is-ancestor "$candidate" refs/remotes/upstream/main || {
            echo 'upstream_sha must be reachable from upstream main.' >&2
            exit 1
          }
          directory="$RUNNER_TEMP/upstream-review"
          mkdir -p "$directory"
          {
            echo "base=$(git rev-parse HEAD)"
            echo "upstream=$(git rev-parse "$candidate")"
            echo "month=$(date -u +%Y-%m)"
            echo "directory=$directory"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure tracking label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create upstream-review --repo "$GITHUB_REPOSITORY" --color 0e8a16 \
            --description 'Monthly upstream review tracking issue' || true

      - name: Find previous review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node eng/upstream/review-issue.mjs previous --repo "$GITHUB_REPOSITORY" \
            --month "${{ steps.pin.outputs.month }}" \
            --output "${{ steps.pin.outputs.directory }}/previous-review.json"

      - name: Collect upstream inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node eng/upstream/collect-inventory.mjs --repository "$UPSTREAM_REPOSITORY" \
            --upstream "${{ steps.pin.outputs.upstream }}" \
            --output "${{ steps.pin.outputs.directory }}/inventory.json"

      - name: Summarize review
        run: |
          node eng/upstream/prepare-review.mjs --repo "$GITHUB_WORKSPACE" \
            --base "${{ steps.pin.outputs.base }}" \
            --upstream "${{ steps.pin.outputs.upstream }}" \
            --month "${{ steps.pin.outputs.month }}" \
            --inventory "${{ steps.pin.outputs.directory }}/inventory.json" \
            --previous "${{ steps.pin.outputs.directory }}/previous-review.json" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --artifact "upstream-review-${{ steps.pin.outputs.month }}-${{ github.run_id }}" \
            --output "${{ steps.pin.outputs.directory }}"
          cat "${{ steps.pin.outputs.directory }}/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload inventory and summary
        if: ${{ always() && steps.pin.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-review-${{ steps.pin.outputs.month }}-${{ github.run_id }}
          path: ${{ steps.pin.outputs.directory }}
          if-no-files-found: error
          retention-days: 90

      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node eng/upstream/review-issue.mjs publish --repo "$GITHUB_REPOSITORY" \
            --month "${{ steps.pin.outputs.month }}" \
            --body-file "${{ steps.pin.outputs.directory }}/summary.md"
