name: Build
on:
  push:
    branches: [main, 'runic/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        primitives: ['8.4.0', '9.0.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5.3.0
        with:
          global-json-file: global.json
      - name: Build .NET 10
        run: dotnet build src/DynamicData.sln -c Release -p:ReactiveUIPrimitivesVersion=${{ matrix.primitives }}
      - name: Test Primitives flavor
        run: dotnet src/DynamicData.Tests/bin/Release/net10.0/DynamicData.Tests.dll --maximum-parallel-tests 8 --results-directory artifacts/tests/primitives
      - name: Test System.Reactive flavor
        run: dotnet src/DynamicData.Reactive.Tests/bin/Release/net10.0/DynamicData.Reactive.Tests.dll --maximum-parallel-tests 8 --results-directory artifacts/tests/reactive
      - name: Pack current Primitives packages
        if: matrix.primitives == '9.0.0'
        run: dotnet pack src/DynamicData.sln -c Release --no-build -o artifacts/packages
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: dynamicdata-${{ matrix.os }}-${{ matrix.primitives }}
          path: artifacts
