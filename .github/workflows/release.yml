name: Package release
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build, test, pack and run every release check without creating the GitHub release or pushing to nuget.org
        required: false
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: package-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  # Read-only: builds, tests and packs, then runs every check of the later jobs.
  # In a dry run this is the last job.
  packages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.pair.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      # sha256sum lines of the pair; later jobs check their download against them.
      sha256: ${{ steps.pair.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet build src/DynamicData.sln -c Release
      - run: dotnet src/DynamicData.Tests/bin/Release/net10.0/DynamicData.Tests.dll --maximum-parallel-tests 8
      - run: dotnet src/DynamicData.Reactive.Tests/bin/Release/net10.0/DynamicData.Reactive.Tests.dll --maximum-parallel-tests 8
      - run: dotnet pack src/DynamicData.sln -c Release --no-build -o artifacts/packages
      - name: Validate the pair and check the GitHub release without creating it
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash eng/release/release-assets.sh check artifacts/packages
      - name: Check nuget.org without pushing
        shell: bash
        run: bash eng/release/release-assets.sh nuget-check artifacts/packages
      - name: Record the package pair
        id: pair
        shell: bash
        working-directory: artifacts/packages
        run: |
          reactive=(RunicArtifex.DynamicData.Reactive.*.nupkg)
          version="${reactive[0]#RunicArtifex.DynamicData.Reactive.}"
          version="${version%.nupkg}"
          {
            echo "version=$version"
            echo 'sha256<<SHA256'
            sha256sum -- *.nupkg
            echo SHA256
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: packages-${{ github.run_id }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 30
  github-release:
    needs: packages
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.packages.outputs.artifact-id }}
          path: artifacts/packages
      - name: Check the pair against the packages job
        working-directory: artifacts/packages
        env:
          PACKAGES_SHA256: ${{ needs.packages.outputs.sha256 }}
        run: |
          test -n "$PACKAGES_SHA256"
          printf '%s\n' "$PACKAGES_SHA256" | sha256sum --check --strict
      - name: Validate and create the GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash eng/release/release-assets.sh publish artifacts/packages
  # The only job with id-token: write; it runs in the protected nuget environment.
  nuget:
    needs: [packages, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.packages.outputs.artifact-id }}
          path: artifacts/packages
      - name: Check the pair against the packages job
        working-directory: artifacts/packages
        env:
          PACKAGES_SHA256: ${{ needs.packages.outputs.sha256 }}
        run: |
          test -n "$PACKAGES_SHA256"
          printf '%s\n' "$PACKAGES_SHA256" | sha256sum --check --strict
      # Keyless: refuses changed published versions and IDs the key could not push.
      - name: Check nuget.org before logging in
        shell: bash
        run: bash eng/release/release-assets.sh nuget-check artifacts/packages
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push missing packages to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        shell: bash
        run: bash eng/release/release-assets.sh nuget-push artifacts/packages
  # dotnet restore reports NU1102 until the flat container lists a pushed version.
  # Holds no token or secret.
  indexed:
    needs: [packages, nuget]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Wait until nuget.org lists both packages
        env:
          VERSION: ${{ needs.packages.outputs.version }}
        shell: bash
        run: bash eng/release/release-assets.sh wait-indexed "$VERSION"
